<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/jpg" href="/ashiqur.jpg">
<title>ashiqur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>

  :root{
    --bg: #0b0c0e;
    --bg-2: #101216;
    --line: rgba(255,255,255,0.08);
    --line-strong: rgba(255,255,255,0.16);
    --ink: #eae8e2;
    --ink-dim: #82838c;
    --accent: #c9a876;
  }

  a{ color:inherit; text-decoration:none; outline:none; -webkit-tap-highlight-color:transparent; }
  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{ height:100%; }

  body{
    font-family:'Inter', Arial, sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding: 60px 20px;
    background:
      radial-gradient(ellipse at 50% 0%, #14151a 0%, var(--bg) 55%),
      var(--bg);
    color: var(--ink);
  }

  .content{
    width:100%;
    max-width: 880px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  /* clock */
  .clock-section{
    width:100%;
    text-align:center;
    opacity:0;
    animation: rise 0.9s ease forwards;
  }

  .clock-label{
    font-size: 0.72rem;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 22px;
    font-weight:500;
  }

  .big-clock{
    font-family:'Space Grotesk', 'Inter', sans-serif;
    font-size: clamp(3rem, 11vw, 7.2rem);
    font-weight: 300;
    color: var(--ink);
    letter-spacing: 2px;
    font-variant-numeric: tabular-nums;
    line-height:1;
  }

  .rule{
    width: 64px;
    height:1px;
    background: var(--line-strong);
    margin: 26px auto;
  }

  .date-line{
    font-size: clamp(0.95rem, 2vw, 1.15rem);
    color: var(--ink);
    letter-spacing: 0.5px;
    font-weight:400;
  }

  .tz-line{
    margin-top: 8px;
    font-size: 0.8rem;
    color: var(--ink-dim);
    letter-spacing: 0.5px;
  }

  /* world time list */
  .world-section{
    margin-top: 72px;
    width:100%;
    opacity:0;
    animation: rise 0.9s ease forwards 0.15s;
  }

  .world-label{
    font-size: 0.68rem;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin-bottom: 18px;
    text-align:center;
  }

  .world-grid{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    border-top: 1px solid var(--line);
    border-left: 1px solid var(--line);
  }

  .world-card{
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    padding: 22px 14px;
    text-align:center;
    transition: background 0.25s ease;
  }

  .world-card:hover{
    background: rgba(255,255,255,0.025);
  }

  .world-city{
    font-size: 0.68rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin-bottom: 10px;
  }

  .world-time{
    font-family:'Space Grotesk', 'Inter', sans-serif;
    font-size: clamp(1.15rem, 2.4vw, 1.45rem);
    font-weight: 400;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.5px;
  }

  .world-date{
    margin-top: 6px;
    font-size: 0.7rem;
    color: var(--ink-dim);
    letter-spacing: 0.5px;
  }

  footer{
    margin-top: 64px;
    font-size: 0.72rem;
    color: var(--ink-dim);
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity:0;
    animation: rise 0.9s ease forwards 0.3s;
  }

  footer a:hover{ color: var(--accent); }

  @keyframes rise{
    from{ opacity:0; transform: translateY(10px); }
    to{ opacity:1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce){
    .clock-section, .world-section, footer{ animation:none; opacity:1; }
  }
</style>
</head>
<body>

<div class="content">

  <div class="clock-section">
    <div class="clock-label">Local Time</div>
    <div class="big-clock" id="bigClock">00:00:00</div>
    <div class="rule"></div>
    <div class="date-line" id="dateLine">Loading date...</div>
    <div class="tz-line" id="tzLine"></div>
  </div>

  <div class="world-section">
    <div class="world-label">World Clocks</div>
    <div class="world-grid" id="worldGrid"></div>
  </div>

  <footer>
    <a href="https://instagram.com/ashiqur.sf" target="_blank">ashiqur</a>
  </footer>

</div>

<script>
  function pad(n){ return n.toString().padStart(2,'0'); }

  function updateLocalClock(){
    const now = new Date();
    const h = pad(now.getHours());
    const m = pad(now.getMinutes());
    const s = pad(now.getSeconds());
    document.getElementById('bigClock').textContent = `${h}:${m}:${s}`;

    const options = { weekday:'long', year:'numeric', month:'long', day:'numeric' };
    document.getElementById('dateLine').textContent = now.toLocaleDateString(undefined, options);

    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
    document.getElementById('tzLine').textContent = `Time Zone: ${tz}`;
  }

  const worldZones = [
    { city: "New York", tz: "America/New_York" },
    { city: "London", tz: "Europe/London" },
    { city: "Dubai", tz: "Asia/Dubai" },
    { city: "Dhaka", tz: "Asia/Dhaka" },
    { city: "Kolkata", tz: "Asia/Kolkata" },
    { city: "Singapore", tz: "Asia/Singapore" },
    { city: "Tokyo", tz: "Asia/Tokyo" },
    { city: "Sydney", tz: "Australia/Sydney" },
  ];

  const worldGrid = document.getElementById('worldGrid');
  worldZones.forEach(z => {
    const card = document.createElement('div');
    card.className = 'world-card';
    card.innerHTML = `
      <div class="world-city">${z.city}</div>
      <div class="world-time" id="time-${z.tz.replace(/\//g,'-')}">--:--:--</div>
      <div class="world-date" id="date-${z.tz.replace(/\//g,'-')}"></div>
    `;
    worldGrid.appendChild(card);
  });

  function updateWorldClocks(){
    const now = new Date();
    worldZones.forEach(z => {
      const id = z.tz.replace(/\//g,'-');
      const timeStr = now.toLocaleTimeString('en-US', { timeZone: z.tz, hour12:false });
      const dateStr = now.toLocaleDateString('en-US', { timeZone: z.tz, month:'short', day:'numeric' });
      document.getElementById('time-'+id).textContent = timeStr;
      document.getElementById('date-'+id).textContent = dateStr;
    });
  }

  function tick(){
    updateLocalClock();
    updateWorldClocks();
  }

  tick();
  setInterval(tick, 1000);
</script>

</body>
</html>
