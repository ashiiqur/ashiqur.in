<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Favicons -->
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">

<!-- Primary Meta Tags -->
<title>ashiqur</title>
<meta name="title" content="ashiqur">
<meta name="description" content="Comingsoon Page">

<!-- Open Graph / Facebook / WhatsApp / Telegram -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://ashiqur.in/">
<meta property="og:title" content="ashiqur">
<meta property="og:description" content="Comingsoon Page">
<meta property="og:image" content="https://ashiqur.in/preview-image.png">

<!-- Twitter -->
<meta property="twitter:card" content="summary_large_image">
<meta property="twitter:url" content="https://ashiqur.in/">
<meta property="twitter:title" content="ashiqur">
<meta property="twitter:description" content="Comingsoon Page">
<meta property="twitter:image" content="https://ashiqur.in/preview-image.png">
  
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>

  :root{
    --bg: #0b0c0e;
    --bg-2: #101216;
    --line: rgba(255,255,255,0.08);
    --line-strong: rgba(255,255,255,0.16);
    --ink: #eae8e2;
    --ink-dim: #82838c;
    --accent: #c9a876;
  }

  a{ color:inherit; text-decoration:none; outline:none; -webkit-tap-highlight-color:transparent; }
  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{ height:100%; }

 body{
    font-family:'Inter', Arial, sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 0 20px;
    background:
      radial-gradient(ellipse at 50% 50%, #14151a 0%, var(--bg) 60%),
      var(--bg);
    background-attachment: fixed;
    color: var(--ink);
  }

  .content{
    width:100%;
    max-width: 880px;
    display:flex;
    flex-direction:column;
    align-items:center;
    margin: auto;
    padding-top: 1px; 
    padding-bottom: 1px;
  }

  @media (max-width: 768px) {
    .content {
      padding-top: 10px;
      padding-bottom: 10px;
    }
  }

  /* clock */
  .clock-section{
    width:100%;
    text-align:center;
  }

  .clock-label{
    font-size: 0.72rem;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 22px;
    font-weight:500;
  }

  .big-clock{
    font-family:'Space Grotesk', 'Inter', sans-serif;
    font-size: clamp(3rem, 11vw, 7.2rem);
    font-weight: 300;
    color: var(--ink);
    letter-spacing: 2px;
    font-variant-numeric: tabular-nums;
    line-height:1;
  }

  .rule{
    width: 64px;
    height:1px;
    background: var(--line-strong);
    margin: 26px auto;
  }

  .date-line{
    font-size: clamp(0.95rem, 2vw, 1.15rem);
    color: var(--ink);
    letter-spacing: 0.5px;
    font-weight:400;
  }

  .tz-line{
    margin-top: 8px;
    font-size: 0.8rem;
    color: var(--ink-dim);
    letter-spacing: 0.5px;
  }

  /* world time list */
  .world-section{
    margin-top: 72px;
    width:100%;
  }

  .world-label{
    font-size: 0.68rem;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin-bottom: 18px;
    text-align:center;
  }

  .world-grid{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    border-top: 1px solid var(--line);
    border-left: 1px solid var(--line);
  }

  .world-card{
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    padding: 22px 14px;
    text-align:center;
    transition: background 0.25s ease;
  }

  .world-card:hover{
    background: rgba(255,255,255,0.025);
  }

  .world-city{
    font-size: 0.68rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin-bottom: 10px;
  }

  .world-time{
    font-family:'Space Grotesk', 'Inter', sans-serif;
    font-size: clamp(1.15rem, 2.4vw, 1.45rem);
    font-weight: 400;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.5px;
  }

  .world-date{
    margin-top: 6px;
    font-size: 0.7rem;
    color: var(--ink-dim);
    letter-spacing: 0.5px;
  }

  footer{
    margin-top: 64px;
    font-size: 0.72rem;
    color: var(--ink-dim);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  footer a:hover{ color: var(--accent); }
</style>
</head>
<body>

<div class="content">

  <div class="clock-section">
    <div class="clock-label">Local Time</div>
    <div class="big-clock" id="bigClock">00:00:00</div>
    <div class="rule"></div>
    <div class="date-line" id="dateLine">Loading date...</div>
    <div class="tz-line" id="tzLine"></div>
  </div>

  <div class="world-section">
    <div class="world-label">World Clocks</div>
    <div class="world-grid" id="worldGrid"></div>
  </div>

  <footer>
    <a href="https://instagram.com/ashiqur.sf" target="_blank">ashiqur</a>
  </footer>

</div>

<script>
  // Default to UTC (International Time) on load instead of browser default
  let localTZ = 'UTC';
  let localLabel = 'UTC (International Time)';

  function updateLocalClock(){
    const now = new Date();
    const timeStr = now.toLocaleTimeString('en-US', { timeZone: localTZ, hour12:false });
    document.getElementById('bigClock').textContent = timeStr;

    const dateStr = now.toLocaleDateString('en-US', { timeZone: localTZ, weekday:'long', year:'numeric', month:'long', day:'numeric' });
    document.getElementById('dateLine').textContent = dateStr;

    document.getElementById('tzLine').textContent = localLabel ? `${localLabel} · ${localTZ}` : localTZ;
  }

  async function detectLocation(){
    try{
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 4000);
      const res = await fetch('https://ipapi.co/json/', { signal: controller.signal });
      clearTimeout(timer);
      if(!res.ok) throw new Error('lookup failed');
      const data = await res.json();
      if(data && data.timezone){
        localTZ = data.timezone;
        localLabel = [data.city, data.country_name].filter(Boolean).join(', ');
      }
    }catch(err){
      // If ipapi.co fails or is blocked/rate-limited, it continues showing UTC (International Time)
    }
  }

  const worldZones = [
    { city: "Los Angeles", tz: "America/Los_Angeles" },
    { city: "New York", tz: "America/New_York" },
    { city: "London", tz: "Europe/London" },
    { city: "Paris", tz: "Europe/Paris" },
    { city: "Dubai", tz: "Asia/Dubai" },
    { city: "Kolkata", tz: "Asia/Kolkata" },
    { city: "Dhaka", tz: "Asia/Dhaka" },
    { city: "Singapore", tz: "Asia/Singapore" },
    { city: "Tokyo", tz: "Asia/Tokyo" },
    { city: "Sydney", tz: "Australia/Sydney" },
  ];

  const worldGrid = document.getElementById('worldGrid');
  worldZones.forEach(z => {
    const card = document.createElement('div');
    card.className = 'world-card';
    card.innerHTML = `
      <div class="world-city">${z.city}</div>
      <div class="world-time" id="time-${z.tz.replace(/\//g,'-')}">--:--:--</div>
      <div class="world-date" id="date-${z.tz.replace(/\//g,'-')}"></div>
    `;
    worldGrid.appendChild(card);
  });

  function updateWorldClocks(){
    const now = new Date();
    worldZones.forEach(z => {
      const id = z.tz.replace(/\//g,'-');
      const timeStr = now.toLocaleTimeString('en-US', { timeZone: z.tz, hour12:false });
      const dateStr = now.toLocaleDateString('en-US', { timeZone: z.tz, month:'short', day:'numeric' });
      document.getElementById('time-'+id).textContent = timeStr;
      document.getElementById('date-'+id).textContent = dateStr;
    });
  }

  function tick(){
    updateLocalClock();
    updateWorldClocks();
  }

  tick();
  setInterval(tick, 1000);
  detectLocation().then(tick);

// Triple-tap redirection feature
  let tapCount = 0;
  let tapTimeout;

  document.addEventListener('click', () => {
    tapCount++;
    clearTimeout(tapTimeout);

    if (tapCount === 3) {
      window.location.href = 'https://blog.ashiqur.in';
    }

    tapTimeout = setTimeout(() => {
      tapCount = 0;
    }, 500); // Resets tap count if 3 taps don't happen within 500ms
  });

// Prevent text selection on double/triple clicks (but allow drag selection)
  document.addEventListener('mousedown', (e) => {
    if (e.detail > 1) {
      e.preventDefault();
    }
  });
</script>

</body>
</html>
